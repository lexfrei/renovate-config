name: Validate

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --no-global: without it a file named on the command line is validated as
      # self-hosted global config, which lets repo-only violations through.
      # --strict: turn a pending config migration into a failure instead of a log line.
      # @latest on purpose, against the usual pin-your-tools rule: the bot that
      # consumes this preset always runs the newest release, so a pinned validator
      # would go green on a config the real thing has already started rejecting.
      # The cost is that an upstream deprecation can turn this red on an unrelated
      # PR, which is the warning we want anyway.
      - name: Validate preset
        run: npx --yes --package renovate@latest renovate-config-validator --no-global --strict default.json

      - name: Check README examples
        run: node hack/check-examples.mjs
